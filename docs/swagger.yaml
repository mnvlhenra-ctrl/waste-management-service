basePath: /
definitions:
  delivery.loginRequest:
    properties:
      email:
        example: user@gmail.com
        type: string
      password:
        example: password123
        type: string
    type: object
  delivery.registerRequest:
    properties:
      email:
        example: user@gmail.com
        type: string
      house_number:
        example: A-12
        type: string
      password:
        example: password123
        type: string
    type: object
  domain.Invoice:
    properties:
      amount:
        type: number
      billing_month:
        type: string
      due_date:
        type: string
      house_id:
        type: integer
      id:
        type: integer
      status:
        type: string
    type: object
  domain.Transaction:
    properties:
      amount:
        type: number
      id:
        type: integer
      invoice_id:
        type: integer
      name:
        type: string
      status:
        type: string
      transaction_date:
        type: string
      transaction_type:
        type: string
      user_id:
        type: integer
    type: object
  domain.User:
    properties:
      balance:
        type: number
      email:
        type: string
      id:
        type: integer
      password:
        type: string
      role:
        type: string
    type: object
  domain.Waste:
    properties:
      category:
        type: string
      costs:
        type: number
      created_at:
        type: string
      id:
        type: integer
      is_separated:
        type: boolean
      name:
        type: string
      stock_availability:
        type: number
    type: object
  http.createPickupRequest:
    properties:
      pickup_date:
        example: "2026-09-15T09:00:00Z"
        type: string
      user_id:
        example: 1
        type: integer
      waste_type:
        example: Organic
        type: string
    type: object
  http.paymentRequest:
    properties:
      amount:
        type: number
      invoice_id:
        type: integer
      user_id:
        type: integer
    type: object
  http.topUpRequest:
    properties:
      amount:
        type: number
      user_id:
        type: integer
    type: object
  usecase.PickupSchedule:
    properties:
      id:
        type: integer
      pickup_date:
        type: string
      user_id:
        type: integer
      waste_type:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: REST API for Waste Management Service
  title: Waste Management Service API
  version: "1.0"
paths:
  /api/v1/pickups:
    post:
      consumes:
      - application/json
      description: Create a new waste pickup schedule
      parameters:
      - description: Pickup schedule request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.createPickupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/usecase.PickupSchedule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create pickup schedule
      tags:
      - Pickups
  /api/v1/pickups/reminder-test:
    post:
      description: Manually trigger the pickup reminder job for testing
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Test pickup reminder
      tags:
      - Pickups
  /api/v1/pickups/tomorrow:
    get:
      description: Get all waste pickup schedules for tomorrow
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/usecase.PickupSchedule'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get tomorrow pickup schedules
      tags:
      - Pickups
  /api/v1/transactions:
    get:
      description: Get all transactions for a user
      parameters:
      - description: User ID
        in: query
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Transaction'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get user transactions
      tags:
      - Transactions
  /api/v1/transactions/{id}:
    get:
      description: Get transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get transaction by ID
      tags:
      - Transactions
  /api/v1/transactions/pay:
    post:
      consumes:
      - application/json
      description: Create a new payment transaction
      parameters:
      - description: Payment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.paymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create payment transaction
      tags:
      - Transactions
  /api/v1/transactions/topup:
    post:
      consumes:
      - application/json
      description: Create a new top up transaction
      parameters:
      - description: Top up request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/http.topUpRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create top up transaction
      tags:
      - Transactions
  /api/v1/users/invoices:
    get:
      description: Get all invoices belonging to the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Invoice'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get my invoices
      tags:
      - Users
  /api/v1/users/login:
    post:
      consumes:
      - application/json
      description: Login user and return JWT token
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/delivery.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - Users
  /api/v1/users/profile:
    get:
      description: Get profile information of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Users
  /api/v1/users/register:
    post:
      consumes:
      - application/json
      description: Register a new user and associate the user with a house
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/delivery.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register user
      tags:
      - Users
  /api/v1/wastes:
    get:
      description: Get all wastes with optional filters for category and separation
        status
      parameters:
      - description: Filter by Category (e.g., Organik, Anorganik)
        in: query
        name: category
        type: string
      - description: Filter by separation status (true / false)
        in: query
        name: is_separated
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Waste'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get all wastes
      tags:
      - Wastes
    post:
      consumes:
      - application/json
      description: Create a new waste category/service option
      parameters:
      - description: Waste Data
        in: body
        name: waste
        required: true
        schema:
          $ref: '#/definitions/domain.Waste'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Waste'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create waste catalog
      tags:
      - Wastes
  /api/v1/wastes/{id}:
    delete:
      description: Delete waste catalog by ID
      parameters:
      - description: Waste ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete waste
      tags:
      - Wastes
    get:
      description: Get specific waste service by ID
      parameters:
      - description: Waste ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Waste'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get waste by ID
      tags:
      - Wastes
    put:
      consumes:
      - application/json
      description: Update waste catalog information
      parameters:
      - description: Waste ID
        in: path
        name: id
        required: true
        type: integer
      - description: Waste Data
        in: body
        name: waste
        required: true
        schema:
          $ref: '#/definitions/domain.Waste'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Waste'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update waste
      tags:
      - Wastes
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: 'Enter your JWT token with the Bearer prefix. Example: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
